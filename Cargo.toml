[package]
name = "caller"
version = "0.3.10"
edition = "2024"
license-file = "LICENSE"
description = "A WebApi Caller"
homepage = "https://github.com/lljxww/rust-caller"
repository = "https://github.com/lljxww/rust-caller"
readme = "README.md"

[features]
default = []
server = ["axum", "tower-http"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
thiserror = "1.0"
notify = { version = "6", features = ["serde"] }
async-trait = "0.1"
futures = "0.3"

# Server dependencies (optional)
axum = { version = "0.8", optional = true }
tower-http = { version = "0.6", features = ["cors", "fs"], optional = true }

# Example with required features
[[example]]
name = "server"
required-features = ["server"]

[[example]]
name = "config-cli"
path = "examples/config-cli.rs"