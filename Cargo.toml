[package]
name = "caller"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "A configurable async HTTP client with typed parameters, authentication, retries, middleware, and multi-format configuration"
homepage = "https://github.com/lljxww/rust-caller"
repository = "https://github.com/lljxww/rust-caller"
documentation = "https://docs.rs/caller"
readme = "README.md"
keywords = ["http", "api", "client", "openapi", "caller"]
categories = ["api-bindings", "web-programming::http-client", "config"]
exclude = [".github/", ".vscode/", "downloads/", "examples/caller.*", "api_result_test.json"]

[features]
default = []
server = ["axum", "tower-http", "form_urlencoded"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net"] }
thiserror = "1.0"
notify = "6"
async-trait = "0.1"

# Server dependencies (optional)
axum = { version = "0.8", optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }
form_urlencoded = { version = "1", optional = true }

# Example with required features
[[example]]
name = "server"
required-features = ["server"]

[[example]]
name = "config-cli"
path = "examples/config-cli.rs"
