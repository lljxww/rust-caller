[package]
name = "caller"
version = "0.1.2"
edition = "2024"
license-file = "LICENSE"
description = "A WebApi Caller"
homepage = "https://github.com/lljxww/rust-caller"
repository = "https://github.com/lljxww/rust-caller"
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
thiserror = "1.0"
notify = { version = "6", features = ["serde"] }
async-trait = "0.1"
futures = "0.3"
